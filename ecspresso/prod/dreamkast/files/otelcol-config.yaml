---
extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: 1m
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      paging:

processors:
  resource/dreamkast:
    attributes:
      - action: upsert
        key: service.namespace
        value: dreamkast
      - action: upsert
        key: service.name
        value: dreamkast
      - action: upsert
        key: deployment.environment.name
        value: prod
  transform/mackerel_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # JSON文字列を構造化ログに変換
          - set(body, ParseJSON(body))
            where IsString(body)

          # trace_id/span_idを設定
          - set(trace_id.string, body["trace_id"]) where IsMap(body) and body["trace_id"] != nil
          - delete_key(body, "trace_id") where IsMap(body)
          - set(span_id.string, body["span_id"]) where IsMap(body) and body["span_id"] != nil
          - delete_key(body, "span_id") where IsMap(body)

          # log level -> OpenTelemetry Severity
          - set(severity_text, body["level"])
            where IsMap(body) and body["level"] != nil

          - set(severity_number, SEVERITY_NUMBER_DEBUG)
            where IsMap(body) and body["level"] == "DEBUG"

          - set(severity_number, SEVERITY_NUMBER_INFO)
            where IsMap(body) and body["level"] == "INFO"

          - set(severity_number, SEVERITY_NUMBER_WARN)
            where IsMap(body) and (body["level"] == "WARN" or body["level"] == "WARNING")

          - set(severity_number, SEVERITY_NUMBER_ERROR)
            where IsMap(body) and body["level"] == "ERROR"

          - set(severity_number, SEVERITY_NUMBER_FATAL)
            where IsMap(body) and body["level"] == "FATAL"

          # Mackerelの構造化ログ検索用
          - set(body["deployment.environment.name"], resource.attributes["deployment.environment.name"])
            where IsMap(body) and resource.attributes["deployment.environment.name"] != nil

          - set(body["service.name"], resource.attributes["service.name"])
            where IsMap(body) and resource.attributes["service.name"] != nil

  resourcedetection:
    detectors: [env, ecs]
    timeout: 2s
    override: false
  batch/logs:
    send_batch_size: 1000
    send_batch_max_size: 1000
  tail_sampling:
    policies:
      - name: include http 5xx response status
        type: numeric_attribute
        numeric_attribute:
          key: http.response.status_code
          min_value: 500
          max_value: 599
      - name: include http 5xx status
        type: numeric_attribute
        numeric_attribute:
          key: http.status_code  # dreamkastはこの古い仕様で送っている
          min_value: 500
          max_value: 599
      - name: include slow http
        type: latency
        latency:
          threshold_ms: 6000
      - name: include random sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 0.1

exporters:
  mackerelotlp:
  otlphttp/loki:
      endpoint: https://loki.cloudnativedays.jp/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics]
      processors:
        - resourcedetection
        - resource/dreamkast
      exporters: [mackerelotlp]
    traces:
      receivers: [otlp]
      processors:
        - resourcedetection
        - resource/dreamkast
        - tail_sampling
      exporters: [mackerelotlp]
    logs:
      receivers: [otlp]
      processors:
        - resourcedetection
        - resource/dreamkast
        - transform/mackerel_logs
        - batch/logs
      exporters: [mackerelotlp,otlphttp/loki]
  extensions: [health_check]
